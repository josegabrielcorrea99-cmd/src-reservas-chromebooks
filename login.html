<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - Reserva de Chromebooks
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >


    <style>

        body {

            min-height: 100vh;

            background:
                #f8f9fa;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

        }


        .login-card {

            width:
                100%;

            max-width:
                420px;

            border:
                none;

            border-radius:
                16px;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,.10);

        }


        .login-icon {

            font-size:
                60px;

        }

    </style>

</head>


<body>


<div class="container">

    <div class="row justify-content-center">

        <div class="col-12">

            <div class="card login-card mx-auto">

                <div class="card-body p-4 p-md-5">


                    <div class="text-center mb-4">

                        <i
                            class="bi bi-laptop text-primary login-icon"
                        ></i>


                        <h2 class="mt-3">
                            Reserva de Chromebooks
                        </h2>


                        <p class="text-muted mb-0">
                            SCRC
                        </p>

                    </div>



                    <div
                        id="loginError"
                        class="alert alert-danger d-none"
                    ></div>



                    <form id="loginForm">


                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label fw-semibold"
                            >
                                E-mail
                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-envelope"></i>

                                </span>


                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="seu@email.com"
                                    required
                                >

                            </div>

                        </div>



                        <div class="mb-4">

                            <label
                                for="senha"
                                class="form-label fw-semibold"
                            >
                                Senha
                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-lock"></i>

                                </span>


                                <input
                                    type="password"
                                    id="senha"
                                    class="form-control"
                                    placeholder="Digite sua senha"
                                    required
                                >

                            </div>

                        </div>



                        <button
                            type="submit"
                            id="btnLogin"
                            class="btn btn-primary w-100 py-2"
                        >

                            <i class="bi bi-box-arrow-in-right"></i>

                            Entrar

                        </button>


                    </form>


                </div>

            </div>

        </div>

    </div>

</div>


<script
    type="module"
    src="/js/login.js"
></script>


</body>

</html>
